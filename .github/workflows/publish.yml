name: Publish to PyPI

# Runs when a GitHub Release is published (tag like v1.0.0).
# Uses PyPI "trusted publishing": no API token is stored in the repository. PyPI trusts this
# workflow file in this repository, and the upload carries a signed attestation that links the
# package to this repo, this commit and this workflow -- a verifiable proof of origin.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${{ github.event.release.tag_name }}" || { echo "Tag ${{ github.event.release.tag_name }} != version v$VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jscoup/
    permissions:
      id-token: write       # trusted publishing + attestations
      attestations: write   # GitHub build-provenance attestation
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
